<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <h1>aiyu 譯語</h1>
    <p class="intro">YouTube 字幕翻譯 — 在影片播放列點「譯」按鈕啟動。</p>

    <label class="row">
      <span>後端 CLI</span>
      <select id="cli">
        <option value="codex">Codex</option>
        <option value="claude">Claude</option>
        <option value="agy">Antigravity</option>
      </select>
    </label>
    <label class="row">
      <span>模型</span>
      <select id="model"></select>
    </label>
    <label class="row">
      <span>目標語言</span>
      <select id="target">
        <option value="zh-TW">繁中（台灣）</option>
        <option value="zh-CN">简中</option>
        <option value="en">English</option>
        <option value="ja">日本語</option>
      </select>
    </label>
    <label class="row">
      <span>風格</span>
      <select id="style">
        <option value="natural">自然口語</option>
        <option value="literal">直譯精準</option>
        <option value="academic">學術正式</option>
      </select>
    </label>

    <div class="row footer">
      <button id="ping">測試 host</button>
      <button id="clear-cache">清空快取</button>
    </div>
    <p id="status" class="status"></p>
    <a class="opts" href="#" id="open-options">進階設定…</a>
    <script src="popup.js"></script>
  </body>
</html>
